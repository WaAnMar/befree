name: Release (APK + AAB)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      V: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version and signing key
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Версия должна быть в формате 1.0.0"; exit 1
          fi
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Нет секретов UPLOAD_KEYSTORE_BASE64 / UPLOAD_KEYSTORE_PASSWORD. Сначала запусти «Create upload key» и добавь секреты."; exit 1
          fi

      - run: unzip -q befree.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d -i > "$RUNNER_TEMP/upload.jks"

      - name: Build signed APK and AAB
        working-directory: befree
        env:
          BEFREE_KEYSTORE: ${{ runner.temp }}/upload.jks
          BEFREE_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          BEFREE_VERSION_NAME: ${{ inputs.version }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Verify signature and prepare files
        run: |
          mkdir out
          cp befree/app/build/outputs/apk/release/app-release.apk "out/BeFree-$V.apk"
          cp befree/app/build/outputs/bundle/release/app-release.aab "out/BeFree-$V.aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "out/BeFree-$V.apk" | tee out/signature.txt
          cd out && sha256sum "BeFree-$V.apk" > "BeFree-$V.apk.sha256"
          cat "BeFree-$V.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: befree-${{ inputs.version }}
          path: out/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(cut -d' ' -f1 "out/BeFree-$V.apk.sha256")
          gh release create "v$V-build${{ github.run_number }}" \
            "out/BeFree-$V.apk" "out/BeFree-$V.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BeFree $V" \
            --notes "Бесплатный приватный трекер восстановления для Android 8.0+.

          Как установить: скачай BeFree-$V.apk, открой файл и разреши установку из этого источника.

          SHA-256: \`$SHA\`"
